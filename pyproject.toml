[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "precision-bounded-egress"
version = "0.1.0"
description = "Runnable reference implementation of precision-bounded location egress using execution finality"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Sangam Das"}]
dependencies = [
  "pydantic>=2.7,<3",
  "cryptography>=42,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
precision-egress = "precision_egress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
